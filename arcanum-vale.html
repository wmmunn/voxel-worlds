<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Arcanum Vale — Jungle Volcano Village</title>
<style>
  body { margin: 0; overflow: hidden; background: #0e1a22; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #ui { position: absolute; top: 16px; left: 20px; color: #f4e8d0; text-shadow: 0 2px 8px #000; pointer-events: none; }
  #ui h1 { margin: 0; font-size: 26px; letter-spacing: 4px; font-weight: 500; }
  #ui p { margin: 3px 0 0; font-size: 11px; letter-spacing: 2px; opacity: 0.75; }
  #hint { position: absolute; bottom: 14px; right: 16px; color: #ddd; background: rgba(0,0,0,0.4); padding: 7px 12px; border-radius: 6px; font-size: 12px; pointer-events: none; }
</style>
</head>
<body>
<div id="ui"><h1>ARCANUM VALE</h1><p>A MEDIEVAL JUNGLE VOLCANO</p></div>
<div id="hint">Drag to orbit · Scroll to zoom · Right-drag to pan</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function() {
  const rand = (() => { let s = 0x5eed; return () => { s = Math.imul(s ^ s >>> 15, s | 1); s ^= s + Math.imul(s ^ s >>> 7, s | 61); return ((s ^ s >>> 14) >>> 0) / 4294967296; }; })();
  const rr = (a, b) => a + (b - a) * rand();
  const ri = (a, b) => Math.floor(rr(a, b + 1));

  function noise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf*xf*(3-2*xf), v = yf*yf*(3-2*yf);
    const a = Math.sin(xi*12.9898 + yi*78.233)*43758.5453 % 1;
    const b = Math.sin((xi+1)*12.9898 + yi*78.233)*43758.5453 % 1;
    const c = Math.sin(xi*12.9898 + (yi+1)*78.233)*43758.5453 % 1;
    const d = Math.sin((xi+1)*12.9898 + (yi+1)*78.233)*43758.5453 % 1;
    return a + (b-a)*u + (c-a)*v + (a-b-c+d)*u*v;
  }
  function fbm(x, y) { let s=0, a=0.5, f=1, n=0; for(let i=0;i<4;i++){ s+=a*noise(x*f,y*f); n+=a; a*=0.5; f*=2.1; } return s/n; }

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0e1a22);
  scene.fog = new THREE.Fog(0x0e1a22, 40, 90);

  const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 200);
  camera.position.set(26, 20, 28);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.07;
  controls.minDistance = 6;
  controls.maxDistance = 70;
  controls.maxPolarAngle = Math.PI * 0.48;
  controls.target.set(0, 5, 0);
  controls.update();

  scene.add(new THREE.AmbientLight(0x334455, 0.7));
  scene.add(new THREE.HemisphereLight(0x446688, 0x1a3020, 0.45));
  const sun = new THREE.DirectionalLight(0xffddaa, 1.0);
  sun.position.set(25, 40, 15);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  scene.add(sun);

  // Terrain height
  const N = 26;
  const height = [];
  for (let z = -N; z <= N; z++) {
    height[z + N] = [];
    for (let x = -N; x <= N; x++) {
      const d = Math.hypot(x, z);
      const edge = 18 + fbm(x * 0.07, z * 0.07) * 5;
      if (d > edge) { height[z + N][x + N] = 0; continue; }
      let h = 3 + fbm(x * 0.05 + 5, z * 0.05) * 4;
      h += Math.exp(-((x - 7)**2 + (z + 5)**2) / 35) * 5; // volcano
      h *= Math.max(0.3, 1 - d / edge * 0.4);
      height[z + N][x + N] = Math.max(1, Math.floor(h));
    }
  }
  function getH(x, z) {
    const ix = Math.round(x) + N, iz = Math.round(z) + N;
    if (ix < 0 || iz < 0 || ix > 2*N || iz > 2*N) return 0;
    return height[iz][ix] || 0;
  }

  // Collect voxels
  const matrices = [], colors = [];
  const glowMatrices = [], glowColors = [];
  function add(x, y, z, col, glow = false) {
    const m = new THREE.Matrix4();
    m.makeTranslation(x, y + 0.5, z);
    if (glow) { glowMatrices.push(m); glowColors.push(new THREE.Color(col)); }
    else { matrices.push(m); colors.push(new THREE.Color(col)); }
  }

  const grass = [0x2d7a2d, 0x3a8c3a, 0x226622];
  const dirt = 0x6b4423, stone = 0x4a4a4a, volc = 0x2a1a18;
  const wood = 0x5c3d2e, leaf = 0x1e7a3a, palm = 0x228B22;
  const wall = 0x7a7060, thatch = 0xc2a36b;
  const crystal = 0x00ccff, rune = 0xaa44ff, glowWin = 0xff66aa, lava = 0xff4500;

  // Island
  for (let z = -N; z <= N; z++) for (let x = -N; x <= N; x++) {
    const h = getH(x, z);
    if (h <= 0) continue;
    for (let y = -2; y <= h; y++) {
      let c = stone;
      if (y === h) c = grass[Math.floor(rand()*grass.length)];
      else if (y > h - 2) c = dirt;
      else if (y < 0) c = volc;
      add(x, y, z, c);
    }
  }

  // Lava
  for (let x = 5; x <= 11; x++) for (let z = -7; z <= -2; z++) {
    const h = getH(x, z);
    if (h > 1) add(x, h, z, lava, true);
  }

  // Trees
  function placeTree(tx, tz) {
    const b = getH(tx, tz);
    if (b < 2) return;
    const th = ri(4, 6);
    for (let y = 1; y <= th; y++) add(tx, b + y, tz, wood);
    const lc = rand() > 0.5 ? leaf : palm;
    for (let dy = -1; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) for (let dz = -2; dz <= 2; dz++) {
      if (dx*dx + dz*dz + dy*dy < 5) add(tx+dx, b+th+dy, tz+dz, lc);
    }
  }
  for (let i = 0; i < 60; i++) {
    const a = rand()*Math.PI*2, d = rr(2, 16);
    placeTree(Math.round(Math.cos(a)*d), Math.round(Math.sin(a)*d));
  }

  // Houses
  function buildHouse(hx, hz) {
    const b = getH(hx, hz);
    for (let y = 1; y <= 3; y++) {
      for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) {
        if (Math.abs(dx) === 1 || Math.abs(dz) === 1) add(hx+dx, b+y, hz+dz, wall);
      }
    }
    for (let y = 0; y < 2; y++) {
      const r = 2 - y;
      for (let dx = -r; dx <= r; dx++) for (let dz = -r; dz <= r; dz++) add(hx+dx, b+4+y, hz+dz, thatch);
    }
    add(hx, b+2, hz+1, glowWin, true);
  }
  buildHouse(-4, 3); buildHouse(3, 5); buildHouse(-2, -3); buildHouse(6, 1);

  // Mage tower
  const tb = getH(-7, 1);
  for (let y = 1; y <= 8; y++) {
    add(-7, tb+y, 1, wall);
    if (y > 5) {
      add(-6, tb+y, 1, wall); add(-8, tb+y, 1, wall);
      add(-7, tb+y, 2, wall); add(-7, tb+y, 0, wall);
    }
    if (y % 3 === 0) add(-7, tb+y, 1, rune, true);
  }
  add(-7, tb+9, 1, crystal, true);
  add(-7, tb+10, 1, crystal, true);

  // Crystals
  function placeCrystal(cx, cz) {
    const b = getH(cx, cz);
    for (let y = 1; y <= ri(2,4); y++) add(cx, b+y, cz, crystal, true);
  }
  placeCrystal(9, -4); placeCrystal(-11, 7); placeCrystal(2, -9); placeCrystal(-5, 9);

  // Meshes
  const box = new THREE.BoxGeometry(1,1,1);
  const landMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
  const land = new THREE.InstancedMesh(box, landMat, matrices.length);
  land.castShadow = true; land.receiveShadow = true;
  for (let i = 0; i < matrices.length; i++) {
    land.setMatrixAt(i, matrices[i]);
    land.setColorAt(i, colors[i]);
  }
  land.instanceMatrix.needsUpdate = true;
  if (land.instanceColor) land.instanceColor.needsUpdate = true;
  scene.add(land);

  const glowMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const glow = new THREE.InstancedMesh(box, glowMat, glowMatrices.length);
  for (let i = 0; i < glowMatrices.length; i++) {
    glow.setMatrixAt(i, glowMatrices[i]);
    glow.setColorAt(i, glowColors[i]);
  }
  glow.instanceMatrix.needsUpdate = true;
  if (glow.instanceColor) glow.instanceColor.needsUpdate = true;
  scene.add(glow);

  // Lights for glow
  const lavaLight = new THREE.PointLight(0xff4400, 1.8, 14);
  lavaLight.position.set(8, getH(8,-4)+1.5, -4.5);
  scene.add(lavaLight);
  const crystalLight = new THREE.PointLight(0x00aaff, 1.4, 12);
  crystalLight.position.set(-7, getH(-7,1)+10, 1);
  scene.add(crystalLight);

  // Walkers (mages)
  const walkers = [];
  function makeWalker() {
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.85, 0.35), new THREE.MeshLambertMaterial({ color: 0x4a3a6a }));
    body.position.y = 0.65; g.add(body);
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.38, 0.38), new THREE.MeshLambertMaterial({ color: 0xe8c8a0 }));
    head.position.y = 1.25; g.add(head);
    const staff = new THREE.Mesh(new THREE.BoxGeometry(0.08, 1.5, 0.08), new THREE.MeshLambertMaterial({ color: 0x5c3d2e }));
    staff.position.set(0.35, 0.9, 0); g.add(staff);
    const orb = new THREE.Mesh(new THREE.SphereGeometry(0.16, 6, 4), new THREE.MeshBasicMaterial({ color: 0xaa44ff }));
    orb.position.set(0.35, 1.75, 0); g.add(orb);
    return g;
  }
  for (let i = 0; i < 5; i++) {
    const w = makeWalker();
    const a = rand()*Math.PI*2, d = rr(3, 11);
    const px = Math.cos(a)*d, pz = Math.sin(a)*d;
    w.position.set(px, getH(px, pz)+0.1, pz);
    w.userData = { angle: rand()*Math.PI*2, timer: rand()*60 };
    scene.add(w);
    walkers.push(w);
  }

  // Wisps
  const wisps = [];
  for (let i = 0; i < 10; i++) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.14, 6, 4), new THREE.MeshBasicMaterial({ color: i%2 ? 0x00ffff : 0xff44aa, transparent: true, opacity: 0.75 }));
    m.userData = { phase: rand()*6.28, r: rr(5, 15), y: rr(7, 13), speed: rr(0.35, 0.65) };
    scene.add(m);
    wisps.push(m);
  }

  // Birds
  const birds = [];
  function makeBird() {
    const g = new THREE.Group();
    g.add(new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.14, 0.22), new THREE.MeshLambertMaterial({ color: 0xdd8833 })));
    const wl = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.05, 0.18), new THREE.MeshLambertMaterial({ color: 0xaa6622 }));
    wl.position.z = 0.14; g.add(wl);
    const wr = wl.clone(); wr.position.z = -0.14; g.add(wr);
    g.userData.wings = [wl, wr];
    return g;
  }
  for (let i = 0; i < 5; i++) {
    const b = makeBird();
    b.userData.r = rr(11, 17); b.userData.speed = rr(0.4, 0.7); b.userData.ph = rand()*6.28; b.userData.y = rr(12, 17);
    scene.add(b); birds.push(b);
  }

  // Steam
  const steamCount = 25;
  const sPos = new Float32Array(steamCount * 3);
  const sVel = [];
  for (let i = 0; i < steamCount; i++) {
    sPos[i*3] = (Math.random()-0.5)*7 + 8;
    sPos[i*3+1] = getH(8,-4) + 2 + Math.random()*3;
    sPos[i*3+2] = (Math.random()-0.5)*5 - 4;
    sVel.push({ x: (Math.random()-0.5)*0.015, y: 0.025 + Math.random()*0.03, z: (Math.random()-0.5)*0.015 });
  }
  const steamGeo = new THREE.BufferGeometry();
  steamGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
  const steam = new THREE.Points(steamGeo, new THREE.PointsMaterial({ color: 0xaaaaaa, size: 0.35, transparent: true, opacity: 0.45 }));
  scene.add(steam);

  let t = 0;
  function animate() {
    requestAnimationFrame(animate);
    t += 0.016;
    controls.update();

    walkers.forEach(w => {
      const ud = w.userData;
      ud.timer--;
      if (ud.timer <= 0) { ud.angle += (rand()-0.5)*1.3; ud.timer = 40 + rand()*60; }
      const nx = w.position.x + Math.cos(ud.angle)*0.015;
      const nz = w.position.z + Math.sin(ud.angle)*0.015;
      const h = getH(nx, nz);
      if (h > 1 && Math.abs(nx) < 16 && Math.abs(nz) < 16) {
        w.position.x = nx; w.position.z = nz; w.position.y = h + 0.1;
        w.rotation.y = -ud.angle + Math.PI/2;
      } else ud.angle += 1.4;
    });

    wisps.forEach((m, i) => {
      const ud = m.userData;
      const ang = t * ud.speed + ud.phase;
      m.position.set(Math.cos(ang)*ud.r, ud.y + Math.sin(t*1.4 + i)*1.0, Math.sin(ang)*ud.r);
      m.material.opacity = 0.45 + Math.sin(t*2.5 + i)*0.3;
    });

    birds.forEach((b, i) => {
      const ang = t * b.userData.speed + b.userData.ph;
      b.position.set(Math.cos(ang)*b.userData.r, b.userData.y + Math.sin(t*1.8 + i)*0.7, Math.sin(ang)*b.userData.r);
      b.rotation.y = -ang + Math.PI/2;
      const flap = Math.sin(t*11 + i)*0.55;
      b.userData.wings[0].rotation.z = flap;
      b.userData.wings[1].rotation.z = -flap;
    });

    const pos = steam.geometry.attributes.position;
    for (let i = 0; i < steamCount; i++) {
      let x = pos.getX(i) + sVel[i].x;
      let y = pos.getY(i) + sVel[i].y;
      let z = pos.getZ(i) + sVel[i].z;
      if (y > getH(8,-4) + 9) {
        y = getH(8,-4) + 2;
        x = (Math.random()-0.5)*6 + 8;
        z = (Math.random()-0.5)*4 - 4;
      }
      pos.setXYZ(i, x, y, z);
    }
    pos.needsUpdate = true;

    lavaLight.intensity = 1.4 + Math.sin(t*1.8)*0.5;
    crystalLight.intensity = 1.1 + Math.sin(t*1.2)*0.4;

    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();
</script>
</body>
</html>
